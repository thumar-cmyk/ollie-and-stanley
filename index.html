<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ollie &amp; Stanley">
  <meta name="application-name" content="Ollie &amp; Stanley">
  <meta name="theme-color" content="#1a120c">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Walk cat brothers Ollie and Stanley around the house.">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <title>Ollie &amp; Stanley</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <canvas id="game" aria-label="Tap the floor to walk"></canvas>
    <div id="hotspots"></div>
    <div id="cat-buttons" role="group" aria-label="Choose a cat"></div>
    <button id="sound-btn" aria-label="Sound off">&#x1F507;</button>
    <div id="room-toast"></div>
    <div id="fade"></div>
    <div id="debug-info" hidden></div>
  </div>
  <div id="rotate">
    <div class="phone">&#x1F4F1;</div>
    <p>Turn your phone sideways<br>to play with Ollie &amp; Stanley!</p>
  </div>
  <script src="js/config.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
